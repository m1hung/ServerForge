# ServerForge stack.
#
# Three profiles:
#   (default)  Postgres + Redis only — for running the panel from source.
#   full       Adds the API and dashboard containers, for a real deployment.
#   tls        Adds Caddy in front, terminating HTTPS for PANEL_DOMAIN.
#
#   npm run stack:up                          # dependencies only
#   docker compose --profile full up -d       # everything, plain HTTP
#   npm run stack:tls                         # everything, behind HTTPS
#
# The API container needs the Docker socket: that is how it creates game
# containers. Treat access to this panel as equivalent to root on the host,
# and never expose it to the internet without the tls profile or an equivalent
# reverse proxy in front.

name: serverforge

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-serverforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-serverforge}
      # Fail fast rather than silently accepting trust auth on a fresh volume.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-serverforge} -d ${POSTGRES_DB:-serverforge}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Queues and the console ring buffer are both reconstructible, so an AOF
    # is unnecessary — but a small snapshot avoids losing queued jobs on a
    # host reboot.
    command: >
      redis-server
      --save 60 1000
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy noeviction
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ['full']
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-serverforge}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-serverforge}?schema=public
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 8080
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env — run npm run bootstrap}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env — run npm run bootstrap}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      BRAND_NAME: ${BRAND_NAME:-ServerForge}
      CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY:-}
      # Paths *inside* this container. The bind mounts below make them line up
      # with the host paths that game containers are created against.
      DATA_ROOT: /var/lib/serverforge/servers
      BACKUP_ROOT: /var/lib/serverforge/backups
      CACHE_ROOT: /var/lib/serverforge/cache
      THEMES_ROOT: /var/lib/serverforge/themes
      # Docker creates game containers as siblings on the host, so the panel
      # must hand the daemon *host* paths, not its own container paths.
      #
      # These must be byte-identical to the bind mount sources below. They are
      # required rather than defaulted because there is no correct default: a
      # value here is read inside the container, while the same text under
      # `volumes:` is resolved by Compose against docker/. Anything relative
      # therefore means two different directories, and any literal absolute
      # default is a guess about someone else's host. When the pair disagrees
      # the daemon silently creates the wrong directory, empty, and the game
      # server fails with "Unable to access jarfile server.jar".
      #
      # `npm run bootstrap` fills both with absolute paths.
      HOST_DATA_ROOT: ${HOST_DATA_ROOT:?empty — run npm run bootstrap to fill it with an absolute path}
      HOST_BACKUP_ROOT: ${HOST_BACKUP_ROOT:?empty — run npm run bootstrap to fill it with an absolute path}
      DOCKER_SOCKET: /var/run/docker.sock
      # Plain-HTTP LAN dashboards cannot store Secure cookies; set true behind TLS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Automatic router port forwarding.
      #
      # UPNP_CONTROL_URL is not optional in this deployment shape, even though
      # it is elsewhere: discovery is SSDP multicast, and multicast does not
      # cross Docker's bridge, so a container can never find the router by
      # itself. The SOAP calls afterwards are ordinary unicast HTTP and work
      # fine from here — the address just has to be handed over.
      UPNP_ENABLED: ${UPNP_ENABLED:-false}
      UPNP_CONTROL_URL: ${UPNP_CONTROL_URL:-}
      UPNP_LEASE_SECONDS: ${UPNP_LEASE_SECONDS:-0}
      UPNP_INTERNAL_IP: ${UPNP_INTERNAL_IP:-}
    ports:
      # BIND_HOST exists for the tls profile: set it to 127.0.0.1 and the only
      # way in from outside the machine is through Caddy on 443. Left at
      # 0.0.0.0 the port is reachable directly, which is what a LAN install
      # wants and what an internet-facing one must not have.
      - '${BIND_HOST:-0.0.0.0}:${API_PORT:-8080}:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same variables as the environment block above, on purpose — see there.
      - ${HOST_DATA_ROOT:?empty — run npm run bootstrap to fill it with an absolute path}:/var/lib/serverforge/servers
      - ${HOST_BACKUP_ROOT:?empty — run npm run bootstrap to fill it with an absolute path}:/var/lib/serverforge/backups
      # Custom CSS themes (Account → Appearance). Bootstrap fills HOST_THEMES_ROOT.
      - ${HOST_THEMES_ROOT:?empty — run npm run bootstrap to fill it with an absolute path}:/var/lib/serverforge/themes
      - serverforge-cache:/var/lib/serverforge/cache
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    profiles: ['full']
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # 'auto' uses the browser hostname + NEXT_PUBLIC_API_PORT so LAN access
        # keeps the session cookie same-site. The host API_PORT must be baked in
        # at build time — otherwise the dashboard forever talks to :8080.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-auto}
        NEXT_PUBLIC_API_PORT: ${API_PORT:-8080}
        NEXT_PUBLIC_BRAND_NAME: ${BRAND_NAME:-ServerForge}
        NEXT_PUBLIC_BRAND_TAGLINE: ${BRAND_TAGLINE:-Launch a game server in minutes, not hours.}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      # See the API's ports block for why the bind address is a variable.
      - '${BIND_HOST:-0.0.0.0}:${WEB_PORT:-3000}:3000'

  # ── TLS front door ────────────────────────────────────────────────────────
  #
  # Opt-in, because it only makes sense once the panel has a domain name
  # pointing at it. Caddy gets and renews the certificate itself, so this is
  # the whole of the HTTPS setup — there is no second step.
  #
  # Requires PANEL_DOMAIN, and NEXT_PUBLIC_API_URL set to the same https URL
  # *before the web image is built*, since Next.js bakes it in. See
  # docs/setup.md.
  caddy:
    profiles: ['tls']
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    environment:
      # Not `${PANEL_DOMAIN:?...}`, however much this wants to be required:
      # Compose interpolates the whole file before it filters by profile, so a
      # required-variable marker here fails `--profile full` too, for everyone
      # who has no domain and never asked for TLS. The check lives in
      # scripts/compose.mjs instead, where it can say so at the command the
      # user actually typed.
      PANEL_DOMAIN: ${PANEL_DOMAIN:-}
    ports:
      # 80 is not optional: it is how the HTTP-01 challenge proves the domain
      # is yours, and how a plain-http visit gets redirected to https.
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing on the next
      # start, which Let's Encrypt rate-limits — keep it.
      - caddy-data:/data
      - caddy-config:/config

networks:
  # Game containers join this network. Declared here so it exists with a
  # predictable name before the first server is deployed.
  games:
    name: serverforge_games
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  serverforge-cache:
  caddy-data:
  caddy-config:
